[project]
name = "jvqvae"
version = "0.1.0"
description = "VQ-VAE with a class-conditional transformer prior for handwritten Japanese characters"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jvqvae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
