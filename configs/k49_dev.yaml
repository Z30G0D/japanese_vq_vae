name: k49_dev
data:
  source: k49
  image_size: 32
  k49_dir: data/k49
  k49_max_per_class: 500
  split:
    seed: 0
model:
  num_codes: 512
  embedding_dim: 64
  # 32x32 needs two stages, not three, to land on the same 8x8 grid as ETL4,
  # which is what keeps the prior identical across the two sources.
  num_downsample: 2
train:
  epochs: 20
  batch_size: 128
  learning_rate: 0.0003
